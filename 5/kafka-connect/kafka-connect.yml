lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  - pattern: 'kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>status: (.+)'
    name: kafka_connect_connector_task_status
    value: 1
    labels:
      connector: "$1"
      task: "$2"
      status: "$3"
    type: GAUGE

  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>source-record-poll-total'
    name: kafka_connect_source_record_poll_total
    labels:
      connector: "$1"
      task: "$2"
    type: COUNTER

  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>source-record-write-total'
    name: kafka_connect_source_record_write_total
    labels:
      connector: "$1"
      task: "$2"
    type: COUNTER

  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>source-record-poll-rate'
    name: kafka_connect_source_record_poll_rate
    labels:
      connector: "$1"
      task: "$2"
    type: GAUGE

  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>source-record-write-rate'
    name: kafka_connect_source_record_write_rate
    labels:
      connector: "$1"
      task: "$2"
    type: GAUGE

  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>source-record-active-count(?!-)'
    name: kafka_connect_source_record_active_count
    labels:
      connector: "$1"
      task: "$2"
    type: GAUGE

  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>poll-batch-avg-time-ms'
    name: kafka_connect_poll_batch_avg_time_ms
    labels:
      connector: "$1"
      task: "$2"
    type: GAUGE

  - pattern: 'kafka.connect<type=task-error-metrics, connector=(.+), task=(.+)><>total-record-errors'
    name: kafka_connect_record_errors_total
    labels:
      connector: "$1"
      task: "$2"
    type: COUNTER

  - pattern: 'kafka.connect<type=task-error-metrics, connector=(.+), task=(.+)><>total-record-failures'
    name: kafka_connect_record_failures_total
    labels:
      connector: "$1"
      task: "$2"
    type: COUNTER

  - pattern: 'kafka.connect<type=connect-worker-metrics><>connector-count'
    name: kafka_connect_worker_connector_count
    type: GAUGE

  - pattern: 'kafka.connect<type=connect-worker-metrics><>task-count'
    name: kafka_connect_worker_task_count
    type: GAUGE

  - pattern: 'debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)><>TotalNumberOfEventsSeen'
    name: debezium_postgres_events_seen_total
    labels:
      plugin: "$1"
      context: "$2"
      server: "$3"
    type: COUNTER

  - pattern: 'debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)><>MilliSecondsSinceLastEvent'
    name: debezium_postgres_milliseconds_since_last_event
    labels:
      plugin: "$1"
      context: "$2"
      server: "$3"
    type: GAUGE
