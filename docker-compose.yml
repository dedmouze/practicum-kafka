version: '3.8'

services:
  # =========================================================
  # Zookeeper — координатор для Kafka
  # =========================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # cub zk-ready — утилита из confluent-образов, ждёт готовности ZK
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "30"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kafka-net

  # =========================================================
  # Брокер Kafka #1
  # =========================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    hostname: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний порт для доступа с хоста (python producer.py локально)
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Два листенера:
      #   PLAINTEXT      — внутренний (broker-to-broker и приложения в докере)
      #   PLAINTEXT_HOST — внешний (с хоста)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Репликация для внутренних топиков Kafka (теперь корректно — 2 брокера)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2

      # Авто-создание топиков выключаем — my-topic создаём вручную (Шаг 1)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Ускоряет join consumer-групп при старте (удобно для отладки)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:9092", "1", "30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kafka-net

  # =========================================================
  # Брокер Kafka #2
  # =========================================================
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    hostname: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Другой внешний порт (29093), чтобы не конфликтовать с kafka-1
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:9092", "1", "30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kafka-net

  # =========================================================
  # Продюсер (2 экземпляра через deploy.replicas)
  # =========================================================
  producer:
    build: .
    image: kafka-python-app:latest   # один образ — переиспользуется всеми app-сервисами
    command: python producer.py
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      # Обрати внимание: kafka-1:9092,kafka-2:9092 (внутренние имена)
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092
    networks:
      - kafka-net
    restart: unless-stopped
    deploy:
      replicas: 2   # работает в Swarm; для обычного compose используй --scale (см. README)

  # =========================================================
  # SingleMessageConsumer (2 экземпляра)
  # =========================================================
  single-consumer:
    build: .
    image: kafka-python-app:latest
    command: python single_message_consumer.py
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092
    networks:
      - kafka-net
    restart: unless-stopped
    deploy:
      replicas: 2

  # =========================================================
  # BatchMessageConsumer (2 экземпляра)
  # =========================================================
  batch-consumer:
    build: .
    image: kafka-python-app:latest
    command: python batch_message_consumer.py
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092
    networks:
      - kafka-net
    restart: unless-stopped
    deploy:
      replicas: 2

networks:
  kafka-net:
    driver: bridge